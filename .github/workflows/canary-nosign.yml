name: Canary IPA (No Sign)

on:
  workflow_dispatch:

concurrency:
  group: canary-nosign
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Restore execute permission for Xcode build scripts
        shell: bash
        run: |
          chmod +x scripts/tauri-ios-xcode-script.sh
          chmod +x scripts/ci/configure-mobile-http.sh || true

      - name: Enable HTTP access for iOS bundle
        run: bash ./scripts/ci/configure-mobile-http.sh enable ios

      - name: Strip code signing settings from Xcode project
        shell: bash
        run: |
          set -euo pipefail
          pbx="src-tauri/crates/tauritavern/gen/apple/tauritavern.xcodeproj/project.pbxproj"
          test -f "$pbx"
          # CODE_SIGN_IDENTITY 设空，DEVELOPMENT_TEAM 替换为 Manual 签名 + 空 profile
          perl -0pi -e '
            s/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "";/g;
            s/DEVELOPMENT_TEAM = "Y82Q3U47CB";/CODE_SIGN_STYLE = Manual;\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "";/g;
          ' "$pbx"
          echo "Patched project.pbxproj signing settings:"
          grep -nE 'CODE_SIGN_IDENTITY|DEVELOPMENT_TEAM|CODE_SIGN_STYLE|PROVISIONING_PROFILE_SPECIFIER' "$pbx" || echo "(none remaining)"

      - name: Build iOS app (unsigned, skip code signing)
        uses: tauri-apps/tauri-action@v1
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODE_SIGN_IDENTITY: ""
          CODE_SIGNING_REQUIRED: "NO"
          CODE_SIGNING_ALLOWED: "NO"
        with:
          projectPath: src-tauri/crates/tauritavern
          tauriScript: node ../../../scripts/tauri-app.mjs
          mobile: ios
          args: --verbose
          uploadWorkflowArtifacts: false

      - name: Pack unsigned IPA with mobileprovision
        shell: bash
        run: |
          # 关掉 GitHub Actions 默认的 -e -o pipefail
          set +e +o pipefail
          APP_DIR=""
          for base in \
            "$HOME/Library/Developer/Xcode/DerivedData"/*/Build/Products/Release-iphoneos \
            "$GITHUB_WORKSPACE/src-tauri/crates/tauritavern/gen/apple/build"/*/Release-iphoneos \
            "$GITHUB_WORKSPACE/src-tauri/crates/tauritavern/gen/apple/build"; do
            [[ -d "$base" ]] || continue
            hit=$(find "$base" -maxdepth 2 -name "*.app" -print -quit 2>/dev/null || true)
            if [[ -n "$hit" && -d "$hit" ]]; then
              APP_DIR="$hit"
              break
            fi
          done
          test -n "${APP_DIR}" && test -d "${APP_DIR}" || {
            echo "ERROR: no .app found"
            find "$HOME/Library/Developer/Xcode/DerivedData" -maxdepth 5 -name "*.app" 2>/dev/null | head -20
            find "$GITHUB_WORKSPACE/src-tauri/crates/tauritavern/gen/apple/build" -maxdepth 5 -name "*.app" 2>/dev/null | head -20
            exit 1
          }
          echo "Found app: $APP_DIR"

          echo "--- .app contents ---"
          ls -la "$APP_DIR"

          # 注入 embedded.mobileprovision
          # Sideloadly/爱思助手重签时需要 mobileprovision 作为 entitlements 模板。
          # 从正规 IPA 提取的 mobileprovision 存为 GitHub Secret（base64），
          # CI 解码后放入 .app。重签工具会用免费 Apple ID 证书从零签名，
          # 继承 mobileprovision 里的 entitlements。
          if [[ -n "${{ secrets.IOS_MOBILE_PROVISION_BASE64 }}" ]]; then
            echo "--- injecting embedded.mobileprovision ---"
            base64 -d <<< "${{ secrets.IOS_MOBILE_PROVISION_BASE64 }}" > "$APP_DIR/embedded.mobileprovision"
            ls -la "$APP_DIR/embedded.mobileprovision"
          else
            echo "::warning::IOS_MOBILE_PROVISION_BASE64 secret not set, .app will lack embedded.mobileprovision"
            echo "::warning::Sideloadly/爱思 will use default entitlements only"
          fi

          # 不做任何 codesign -- 让 Sideloadly/爱思助手用免费 Apple ID 证书从零签名
          # ad-hoc 签名（codesign -s -）会导致 WKWebView GPU 进程被 iOS sandbox
          # 限制（deny mach-lookup / syscall-unix 195），GPU 渲染失败 -> 黑屏。
          # 未签名 IPA 让重签工具完全用 Apple Development 证书签名，绕过 ad-hoc
          # 限制。
          echo "--- skipping codesign (unsigned IPA for Sideloadly/爱思 from-scratch signing) ---"
          echo "--- .app _CodeSignature status ---"
          if [[ -d "$APP_DIR/_CodeSignature" ]]; then
            echo "WARNING: _CodeSignature exists (Xcode may have added it)"
            ls -la "$APP_DIR/_CodeSignature/"
          else
            echo "OK: no _CodeSignature (fully unsigned)"
          fi

          # 打包 IPA
          STAGE="$RUNNER_TEMP/ipa-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/Payload"
          cp -R "$APP_DIR" "$STAGE/Payload/"
          cd "$STAGE"
          zip -qry "$GITHUB_WORKSPACE/TauriTavern-canary-nosign.ipa" Payload
          echo "IPA built at $GITHUB_WORKSPACE/TauriTavern-canary-nosign.ipa"
          ls -lh "$GITHUB_WORKSPACE/TauriTavern-canary-nosign.ipa"

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TauriTavern-canary-nosign-ipa
          path: TauriTavern-canary-nosign.ipa
          if-no-files-found: error
          retention-days: 14
