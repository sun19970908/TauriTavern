name: Canary XcodeBuild

on:
  workflow_dispatch:

concurrency:
  group: canary-xcodebuild
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Restore execute permission for Xcode build scripts
        shell: bash
        run: |
          chmod +x scripts/tauri-ios-xcode-script.sh
          chmod +x scripts/ci/configure-mobile-http.sh || true

      - name: Enable HTTP access for iOS bundle
        run: bash ./scripts/ci/configure-mobile-http.sh enable ios

      - name: Build frontend assets
        run: pnpm run web:build

      - name: Strip code signing settings from Xcode project
        shell: bash
        run: |
          set -euo pipefail
          pbx="src-tauri/crates/tauritavern/gen/apple/tauritavern.xcodeproj/project.pbxproj"
          test -f "$pbx"
          perl -0pi -e '
            s/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "";/g;
            s/DEVELOPMENT_TEAM = "Y82Q3U47CB";/CODE_SIGN_STYLE = Manual;\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "";/g;
          ' "$pbx"
          echo "Patched project.pbxproj signing settings:"
          grep -nE 'CODE_SIGN_IDENTITY|DEVELOPMENT_TEAM|CODE_SIGN_STYLE|PROVISIONING_PROFILE_SPECIFIER' "$pbx" || echo "(none remaining)"

      - name: Build iOS app with xcodebuild (ad-hoc signed)
        shell: bash
        run: |
          set -euo pipefail
          export TAURI_APP_PATH="$GITHUB_WORKSPACE/src-tauri/crates/tauritavern"
          export TAURI_FRONTEND_PATH="$GITHUB_WORKSPACE"

          xcodebuild build \
            -project src-tauri/crates/tauritavern/gen/apple/tauritavern.xcodeproj \
            -scheme tauritavern_iOS \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            -derivedDataPath ./build

      - name: Diagnose and pack IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR="./build/Build/Products/Release-iphoneos/tauritavern_iOS.app"
          test -d "$APP_DIR" || {
            echo "ERROR: $APP_DIR not found"
            echo "--- build/Build/Products ---"
            find ./build/Build/Products -maxdepth 3 -type d 2>/dev/null | head -30
            exit 1
          }
          echo "Found app: $APP_DIR"

          echo "--- .app contents ---"
          ls -la "$APP_DIR"
          echo "--- codesign verify ---"
          codesign -dvvv "$APP_DIR" 2>&1 || echo "(no signature)"
          echo "--- frameworks ---"
          ls -la "$APP_DIR/Frameworks" 2>/dev/null || echo "(no Frameworks dir)"
          if [[ -d "$APP_DIR/Frameworks" ]]; then
            echo "--- frameworks signatures ---"
            for fw in "$APP_DIR/Frameworks"/*; do
              echo ">> $fw"
              codesign -dvvv "$fw" 2>&1 || echo "  (no signature)"
            done
          fi

          STAGE="$RUNNER_TEMP/ipa-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/Payload"
          cp -R "$APP_DIR" "$STAGE/Payload/"
          cd "$STAGE"
          zip -qry "$GITHUB_WORKSPACE/TauriTavern-canary-adhoc.ipa" Payload
          echo "Ad-hoc signed IPA built at $GITHUB_WORKSPACE/TauriTavern-canary-adhoc.ipa"
          ls -lh "$GITHUB_WORKSPACE/TauriTavern-canary-adhoc.ipa"

      - name: Upload ad-hoc signed IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TauriTavern-canary-adhoc-ipa
          path: TauriTavern-canary-adhoc.ipa
          if-no-files-found: error
          retention-days: 14
