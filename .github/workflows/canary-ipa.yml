name: Canary IPA

on:
  workflow_dispatch:

concurrency:
  group: canary-ipa
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Enable HTTP access for iOS bundle
        run: bash ./scripts/ci/configure-mobile-http.sh enable ios

      - name: Strip code signing settings from Xcode project
        shell: bash
        run: |
          set -euo pipefail
          pbx="src-tauri/crates/tauritavern/gen/apple/tauritavern.xcodeproj/project.pbxproj"
          test -f "$pbx"
          # 去掉 DEVELOPMENT_TEAM 和 CODE_SIGN_IDENTITY，让 xcodebuild 不再要求 provisioning profile
          sed -i '' \
            -e '/CODE_SIGN_IDENTITY = "iPhone Developer"/d' \
            -e '/DEVELOPMENT_TEAM = "Y82Q3U47CB"/d' \
            "$pbx"
          echo "Patched project.pbxproj signing settings:"
          grep -nE 'CODE_SIGN_IDENTITY|DEVELOPMENT_TEAM' "$pbx" || echo "(none remaining)"

      - name: Build iOS app (unsigned, skip code signing)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODE_SIGN_IDENTITY: "-"
          CODE_SIGNING_REQUIRED: "NO"
          CODE_SIGNING_ALLOWED: "NO"
        with:
          projectPath: src-tauri/crates/tauritavern
          tauriScript: node ../../../scripts/tauri-app.mjs
          mobile: ios
          args: --verbose

      - name: Locate and repack IPA for local resigning
        shell: bash
        run: |
          set -euo pipefail
          # tauri-action 把产物作为 workflow artifact 上传了，但本地 runner 上也有一份
          # 找到 .xcarchive 里的 .app，打成可被 Sideloadly/AltStore 重签的 Payload 目录 IPA
          ARCH_DIR="$RUNNER_TEMP/tt-archive"
          mkdir -p "$ARCH_DIR"
          # tauri-action 产物路径：src-tauri/crates/tauritavern/gen/apple/build
          APP_DIR=$(find "$GITHUB_WORKSPACE/src-tauri/crates/tauritavern/gen/apple/build" -name "*.app" -path "*Release-iphoneos*" -print -quit 2>/dev/null || true)
          if [[ -z "${APP_DIR}" || ! -d "${APP_DIR}" ]]; then
            # 兜底：找任意 Release-iphoneos 下的 .app
            APP_DIR=$(find "$GITHUB_WORKSPACE/src-tauri/crates/tauritavern/gen/apple/build" -name "*.app" -print -quit)
          fi
          test -n "${APP_DIR}" && test -d "${APP_DIR}" || {
            echo "ERROR: no .app found under gen/apple/build"
            find "$GITHUB_WORKSPACE/src-tauri/crates/tauritavern/gen/apple/build" -maxdepth 4 -type d 2>/dev/null | head -50
            exit 1
          }
          echo "Found app: $APP_DIR"

          # 构造可重签 IPA：Payload/<AppName>.app
          STAGE="$RUNNER_TEMP/ipa-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/Payload"
          cp -R "$APP_DIR" "$STAGE/Payload/"
          cd "$STAGE"
          zip -qry "$GITHUB_WORKSPACE/TauriTavern-canary-unsigned.ipa" Payload
          echo "Unsigned IPA built at $GITHUB_WORKSPACE/TauriTavern-canary-unsigned.ipa"
          ls -lh "$GITHUB_WORKSPACE/TauriTavern-canary-unsigned.ipa"

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TauriTavern-canary-unsigned-ipa
          path: TauriTavern-canary-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
