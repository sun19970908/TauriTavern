name: Canary IPA

on:
  workflow_dispatch:

concurrency:
  group: canary-ipa
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Restore execute permission for Xcode build scripts
        shell: bash
        run: |
          chmod +x scripts/tauri-ios-xcode-script.sh
          chmod +x scripts/ci/configure-mobile-http.sh || true

      - name: Enable HTTP access for iOS bundle
        run: bash ./scripts/ci/configure-mobile-http.sh enable ios

      - name: Strip code signing settings from Xcode project
        shell: bash
        run: |
          set -euo pipefail
          pbx="src-tauri/crates/tauritavern/gen/apple/tauritavern.xcodeproj/project.pbxproj"
          test -f "$pbx"
          # CODE_SIGN_IDENTITY 设空，DEVELOPMENT_TEAM 替换为 Manual 签名 + 空 profile
          perl -0pi -e '
            s/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "";/g;
            s/DEVELOPMENT_TEAM = "Y82Q3U47CB";/CODE_SIGN_STYLE = Manual;\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "";/g;
          ' "$pbx"
          echo "Patched project.pbxproj signing settings:"
          grep -nE 'CODE_SIGN_IDENTITY|DEVELOPMENT_TEAM|CODE_SIGN_STYLE|PROVISIONING_PROFILE_SPECIFIER' "$pbx" || echo "(none remaining)"

      - name: Build iOS app (build only, tolerate archive/export failure)
        uses: tauri-apps/tauri-action@v1
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODE_SIGN_IDENTITY: ""
        with:
          projectPath: src-tauri/crates/tauritavern
          tauriScript: node ../../../scripts/tauri-app.mjs
          mobile: ios
          args: --verbose
          uploadWorkflowArtifacts: false

      - name: Locate .app, verify integrity, sign and pack IPA
        shell: bash
        run: |
          set -euo pipefail

          # --- 定位 build 产物 .app ---
          # tauri ios build 内部调 xcodebuild archive；archive 签名阶段会因无证书失败，
          # 但 build 阶段（含 Copy Bundle Resources / frontendDist 注入）已完成，
          # .app 产物在 DerivedData 或 gen/apple/build 下。
          APP_DIR=""
          for base in \
            "$HOME/Library/Developer/Xcode/DerivedData"/*/Build/Products/Release-iphoneos \
            "$GITHUB_WORKSPACE/src-tauri/crates/tauritavern/gen/apple/build"/*/Release-iphoneos \
            "$GITHUB_WORKSPACE/src-tauri/crates/tauritavern/gen/apple/build"; do
            [[ -d "$base" ]] || continue
            hit=$(find "$base" -maxdepth 2 -name "*.app" -print -quit 2>/dev/null || true)
            if [[ -n "$hit" && -d "$hit" ]]; then
              APP_DIR="$hit"
              echo "Found .app at: $APP_DIR"
              break
            fi
          done

          if [[ -z "${APP_DIR}" || ! -d "${APP_DIR}" ]]; then
            echo "::error::No .app found in build output"
            echo "--- searching DerivedData ---"
            find "$HOME/Library/Developer/Xcode/DerivedData" -maxdepth 5 -name "*.app" 2>/dev/null | head -20 || true
            echo "--- searching gen/apple/build ---"
            find "$GITHUB_WORKSPACE/src-tauri/crates/tauritavern/gen/apple/build" -maxdepth 5 -name "*.app" 2>/dev/null | head -20 || true
            exit 1
          fi

          echo "--- .app root contents ---"
          ls -la "$APP_DIR"

          # --- 完整性校验：前端资源必须存在 ---
          # 黑屏根因是 build 阶段被打断导致 frontendDist 没注入。
          # 校验 index.html 等关键文件，不完整直接 fail 而不是产出黑屏 IPA。
          check_missing=""
          for required in "index.html" "tauri-main.js" "scripts"; do
            if [[ ! -e "$APP_DIR/$required" ]]; then
              check_missing="$check_missing $required"
            fi
          done
          if [[ -n "$check_missing" ]]; then
            echo "::error::Incomplete .app bundle, missing:$check_missing"
            echo "::error::Frontend resources were not injected. The build was interrupted before Copy Bundle Resources completed."
            exit 1
          fi
          echo "✓ .app integrity check passed (index.html / tauri-main.js / scripts present)"

          # --- 手动 ad-hoc 签名（iOS SDK 不允许 ad-hoc，但 build 阶段已禁签完成，
          # 这里对最终 .app 做本地签名，让 Sideloadly 能识别重签）---
          # 用 || true 精确容忍，不全局关 -e
          echo "--- signing embedded frameworks ---"
          if [[ -d "$APP_DIR/Frameworks" ]]; then
            for fw in "$APP_DIR/Frameworks"/*; do
              [[ -e "$fw" ]] || continue
              echo ">> $fw"
              codesign --force --sign - --timestamp=none "$fw" 2>&1 || echo "::warning::sign $fw failed"
            done
          else
            echo "(no Frameworks dir)"
          fi

          echo "--- signing embedded dylibs ---"
          while IFS= read -r dylib; do
            echo ">> $dylib"
            codesign --force --sign - --timestamp=none "$dylib" 2>&1 || echo "::warning::sign $dylib failed"
          done < <(find "$APP_DIR" -name "*.dylib" -type f 2>/dev/null || true)

          echo "--- signing app extensions ---"
          if [[ -d "$APP_DIR/PlugIns" ]]; then
            while IFS= read -r appex; do
              echo ">> $appex"
              codesign --force --sign - --timestamp=none "$appex" 2>&1 || echo "::warning::sign $appex failed"
            done < <(find "$APP_DIR/PlugIns" -name "*.appex" -type d 2>/dev/null || true)
          fi

          echo "--- signing main app ---"
          codesign --force --sign - --timestamp=none "$APP_DIR" 2>&1 || {
            echo "::error::main app codesign failed"
            exit 1
          }

          echo "--- verify signature ---"
          codesign -dvvv "$APP_DIR" 2>&1 || echo "::warning::codesign verify failed"

          # --- 打包 IPA ---
          STAGE="$RUNNER_TEMP/ipa-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/Payload"
          cp -R "$APP_DIR" "$STAGE/Payload/"
          cd "$STAGE"
          zip -qry "$GITHUB_WORKSPACE/TauriTavern-canary-adhoc.ipa" Payload
          echo "IPA built at $GITHUB_WORKSPACE/TauriTavern-canary-adhoc.ipa"
          ls -lh "$GITHUB_WORKSPACE/TauriTavern-canary-adhoc.ipa"

      - name: Upload ad-hoc signed IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TauriTavern-canary-adhoc-ipa
          path: TauriTavern-canary-adhoc.ipa
          if-no-files-found: error
          retention-days: 14
