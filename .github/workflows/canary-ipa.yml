name: Canary IPA

on:
  workflow_dispatch:

concurrency:
  group: canary-ipa
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Restore execute permission for Xcode build scripts
        shell: bash
        run: |
          chmod +x scripts/tauri-ios-xcode-script.sh
          chmod +x scripts/ci/configure-mobile-http.sh || true

      - name: Enable HTTP access for iOS bundle
        run: bash ./scripts/ci/configure-mobile-http.sh enable ios

      - name: Strip code signing settings from Xcode project
        shell: bash
        run: |
          set -euo pipefail
          pbx="src-tauri/crates/tauritavern/gen/apple/tauritavern.xcodeproj/project.pbxproj"
          test -f "$pbx"
          # CODE_SIGN_IDENTITY 设空，DEVELOPMENT_TEAM 替换为 Manual 签名 + 空 profile
          perl -0pi -e '
            s/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "";/g;
            s/DEVELOPMENT_TEAM = "Y82Q3U47CB";/CODE_SIGN_STYLE = Manual;\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "";/g;
          ' "$pbx"
          echo "Patched project.pbxproj signing settings:"
          grep -nE 'CODE_SIGN_IDENTITY|DEVELOPMENT_TEAM|CODE_SIGN_STYLE|PROVISIONING_PROFILE_SPECIFIER' "$pbx" || echo "(none remaining)"

      - name: Build iOS app (unsigned, skip code signing)
        uses: tauri-apps/tauri-action@v1
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODE_SIGN_IDENTITY: ""
          CODE_SIGNING_REQUIRED: "NO"
          CODE_SIGNING_ALLOWED: "NO"
        with:
          projectPath: src-tauri/crates/tauritavern
          tauriScript: node ../../../scripts/tauri-app.mjs
          mobile: ios
          args: --verbose
          uploadWorkflowArtifacts: false

      - name: Manually sign .app with entitlements and pack IPA
        shell: bash
        run: |
          # 关掉 GitHub Actions 默认的 -e -o pipefail，让 codesign/find 失败不中断
          set +e +o pipefail
          APP_DIR=""
          for base in \
            "$HOME/Library/Developer/Xcode/DerivedData"/*/Build/Products/Release-iphoneos \
            "$GITHUB_WORKSPACE/src-tauri/crates/tauritavern/gen/apple/build"/*/Release-iphoneos \
            "$GITHUB_WORKSPACE/src-tauri/crates/tauritavern/gen/apple/build"; do
            [[ -d "$base" ]] || continue
            hit=$(find "$base" -maxdepth 2 -name "*.app" -print -quit 2>/dev/null || true)
            if [[ -n "$hit" && -d "$hit" ]]; then
              APP_DIR="$hit"
              break
            fi
          done
          test -n "${APP_DIR}" && test -d "${APP_DIR}" || {
            echo "ERROR: no .app found"
            find "$HOME/Library/Developer/Xcode/DerivedData" -maxdepth 5 -name "*.app" 2>/dev/null | head -20
            find "$GITHUB_WORKSPACE/src-tauri/crates/tauritavern/gen/apple/build" -maxdepth 5 -name "*.app" 2>/dev/null | head -20
            exit 1
          }
          echo "Found app: $APP_DIR"

          echo "--- .app contents ---"
          ls -la "$APP_DIR"

          # 注入 embedded.mobileprovision
          # ad-hoc 签名的 .app 缺 embedded.mobileprovision，爱思助手重签时
          # 无法继承 entitlements -> WKWebView GPU 渲染被 sandbox 限制 -> 黑屏。
          # 从正规 IPA 提取的 mobileprovision 存为 GitHub Secret（base64），
          # CI 解码后放入 .app。
          if [[ -n "${{ secrets.IOS_MOBILE_PROVISION_BASE64 }}" ]]; then
            echo "--- injecting embedded.mobileprovision ---"
            base64 -d <<< "${{ secrets.IOS_MOBILE_PROVISION_BASE64 }}" > "$APP_DIR/embedded.mobileprovision"
            ls -la "$APP_DIR/embedded.mobileprovision"
          else
            echo "::warning::IOS_MOBILE_PROVISION_BASE64 secret not set, .app will lack embedded.mobileprovision"
            echo "::warning::This will cause black screen after i4tools/Sideloadly re-sign"
          fi

          # 从 mobileprovision 提取 entitlements，用于 codesign --entitlements
          # 根因：ad-hoc 签名（codesign -s -）默认不嵌入 entitlements。.app 里
          # 放了 mobileprovision 文件只能让 iOS 在正规签名流程下读取，但 ad-hoc
          # 签名不会自动读取。必须手动 --entitlements 嵌入二进制签名，iOS 才
          # 会在启动 WKWebView 时认可 application-identifier。
          # 正常 IPA 二进制只嵌 3 个：application-identifier、team-identifier、
          # get-task-allow。application-groups / keychain-access-groups 在爱思
          # 助手用免费 Apple ID 重签时可能不支持，所以移除，只保留最小集。
          ENT_FILE="$APP_DIR/entitlements.plist"
          if [[ -f "$APP_DIR/embedded.mobileprovision" ]]; then
            echo "--- extracting entitlements from mobileprovision ---"
            security cms -D -i "$APP_DIR/embedded.mobileprovision" -o /tmp/profile.plist
            if plutil -extract Entitlements xml1 -o "$ENT_FILE" /tmp/profile.plist 2>&1; then
              plutil -remove com.apple.security.application-groups "$ENT_FILE" 2>/dev/null || true
              plutil -remove keychain-access-groups "$ENT_FILE" 2>/dev/null || true
              echo "--- entitlements.plist content (trimmed) ---"
              cat "$ENT_FILE"
            else
              echo "::warning::failed to extract entitlements from mobileprovision"
              ENT_FILE=""
            fi
          else
            ENT_FILE=""
          fi

          echo "--- signing embedded frameworks ---"
          if [[ -d "$APP_DIR/Frameworks" ]]; then
            for fw in "$APP_DIR/Frameworks"/*; do
              echo ">> $fw"
              codesign --force --sign - --timestamp=none "$fw" 2>&1
              echo "  exit=$?"
            done
          else
            echo "(no Frameworks dir)"
          fi

          echo "--- signing embedded dylibs ---"
          find "$APP_DIR" -name "*.dylib" -type f 2>/dev/null | while read -r dylib; do
            echo ">> $dylib"
            codesign --force --sign - --timestamp=none "$dylib" 2>&1
            echo "  exit=$?"
          done

          echo "--- signing app extensions ---"
          find "$APP_DIR/PlugIns" -name "*.appex" -type d 2>/dev/null | while read -r appex; do
            echo ">> $appex"
            codesign --force --sign - --timestamp=none "$appex" 2>&1
            echo "  exit=$?"
          done

          echo "--- signing main app ---"
          if [[ -n "$ENT_FILE" && -f "$ENT_FILE" ]]; then
            codesign --force --sign - --timestamp=none --entitlements "$ENT_FILE" "$APP_DIR" 2>&1
            MAIN_EXIT=$?
            echo "  exit=$MAIN_EXIT (with entitlements)"
          else
            codesign --force --sign - --timestamp=none "$APP_DIR" 2>&1
            MAIN_EXIT=$?
            echo "  exit=$MAIN_EXIT (no entitlements)"
          fi

          # 诊断：验证签名状态
          echo "--- verify signatures ---"
          codesign -dvvv "$APP_DIR" 2>&1 || echo "(no signature)"
          echo "--- verify entitlements ---"
          codesign -d --entitlements - "$APP_DIR" 2>&1 || echo "(no entitlements)"
          echo "--- verify mobileprovision ---"
          ls -la "$APP_DIR/embedded.mobileprovision" 2>&1 || echo "(no embedded.mobileprovision)"

          # 删除临时 entitlements.plist，不打包进 IPA
          rm -f "$APP_DIR/entitlements.plist"

          # 即使签名失败也尝试产出 IPA，方便本地工具再试
          STAGE="$RUNNER_TEMP/ipa-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/Payload"
          cp -R "$APP_DIR" "$STAGE/Payload/"
          cd "$STAGE"
          zip -qry "$GITHUB_WORKSPACE/TauriTavern-canary-adhoc.ipa" Payload
          echo "IPA built at $GITHUB_WORKSPACE/TauriTavern-canary-adhoc.ipa"
          ls -lh "$GITHUB_WORKSPACE/TauriTavern-canary-adhoc.ipa"

      - name: Upload ad-hoc signed IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TauriTavern-canary-adhoc-ipa
          path: TauriTavern-canary-adhoc.ipa
          if-no-files-found: error
          retention-days: 14
